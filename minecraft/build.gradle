tasks.register('bakeExpansionR3') {
    def pipeline = file('animation_pipeline')
    inputs.files fileTree('animation_pipeline/scripts') {
        include 'prepare-a3.cjs', 'retarget-idle.cjs', 'blender-a3.py', 'blender-r3-refine.py'
    }
    inputs.files file('animation_pipeline/input/UAL1/UAL1_Standard.glb'),
        file('animation_pipeline/converted/m002_r3/steve-r3-refined.blend')
    outputs.files file('animation_pipeline/converted/expansion/poses-new.json'),
        file('animation_pipeline/converted/expansion/motion-only.glb')
    doLast {
        def blender = providers.environmentVariable('TOE_BLENDER').orNull
        if (!blender) {
            def localInstall = new File('C:/Program Files/Blender Foundation/Blender 5.2/blender.exe')
            blender = localInstall.isFile() ? localInstall.absolutePath : 'blender'
        }
        exec { commandLine 'node', new File(pipeline, 'scripts/prepare-a3.cjs'), '--expansion' }
        exec {
            commandLine blender, '-b', '--python-exit-code', '1', '--python',
                new File(pipeline, 'scripts/blender-a3.py'), '--', projectDir, '--expansion'
        }
    }
}
tasks.register('prepareExpansionR3', Exec) {
    dependsOn 'prepareSlimR3', 'bakeExpansionR3'
    commandLine 'node', 'animation_pipeline/scripts/package-expansion.cjs'
}
