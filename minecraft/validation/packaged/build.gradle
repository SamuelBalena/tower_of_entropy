plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
def owner=file('../..')
repositories { flatDir { dirs new File(owner,'build/libs'),new File(owner,'dependencies/cpm'),new File(owner,'.downloads/m002_r2') } }
minecraft {
    mappings channel:'official',version:'1.20.1'
    copyIdeResources=true
    runs {
        client {
            workingDirectory new File(owner,'run-global')
            property 'toe.global.test','true'
            property 'toe.global.packaged','true'
            property 'forge.logging.console.level','info'
            // Release CPM refmaps use SRG; this isolated userdev runtime uses Mojang names.
            property 'mixin.env.remapRefMap','true'
            property 'mixin.env.refMapRemappingFile',file('build/createSrgToMcp/output.srg').absolutePath
            mods { toe_globalqa { source sourceSets.main } }
        }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
    implementation fg.deobf('toe:towerofentropy:0.0.1')
    implementation fg.deobf('local:CustomPlayerModels:1.20-0.6.26a')
    implementation fg.deobf('r2:polymesh:1.0.0:forge')
}
sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/driver')
tasks.register('prepareDriver',Copy) {
    from '../a3_1/java'
    into layout.buildDirectory.dir('generated/driver')
    filter { line -> line.replace('modid="towerofentropy"','modid="toe_globalqa"')
                         .replace('package com.towerofentropy.combat;','package com.towerofentropy.packaged;\nimport com.towerofentropy.combat.CombatController;') }
}
tasks.named('compileJava').configure { dependsOn 'prepareDriver' }
