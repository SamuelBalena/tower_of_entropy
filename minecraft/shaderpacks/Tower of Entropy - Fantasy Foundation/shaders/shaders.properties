# These BIOME and CAT constants come from the Oculus registry, not from numeric IDs in the pack.
variable.bool.toeEligible = in(biome, BIOME_SNOWY_PLAINS, BIOME_ICE_SPIKES, BIOME_FROZEN_RIVER, BIOME_FROZEN_OCEAN, BIOME_DEEP_FROZEN_OCEAN, BIOME_SNOWY_TAIGA, BIOME_GROVE, BIOME_JAGGED_PEAKS, BIOME_FROZEN_PEAKS, BIOME_SNOWY_SLOPES, BIOME_SNOWY_BEACH)
uniform.float.toeCold = smooth(if(toeEligible, 1.0, 0.0), 2.0, 2.0)
uniform.float.toeForest = smooth(if(in(biome_category, CAT_FOREST, CAT_TAIGA, CAT_JUNGLE), 1.0, 0.0), 2.0, 2.0)
uniform.float.toeMarsh = smooth(if(in(biome_category, CAT_SWAMP, CAT_RIVER), 1.0, 0.0), 2.0, 2.0)
uniform.float.toeMountain = smooth(if(in(biome_category, CAT_MOUNTAIN, CAT_EXTREME_HILLS), 1.0, 0.0), 2.0, 2.0)
uniform.float.toeDry = smooth(if(in(biome_category, CAT_DESERT, CAT_MESA, CAT_SAVANNA), 1.0, 0.0), 2.0, 2.0)
uniform.float.toeOverworld = if(in(biome_category, CAT_NETHER, CAT_THE_END), 0.0, 1.0)

uniform.float.toeNether = if(in(biome_category, CAT_NETHER), 1.0, 0.0)
uniform.float.toeEnd = if(in(biome_category, CAT_THE_END), 1.0, 0.0)
oldHandLight=false
