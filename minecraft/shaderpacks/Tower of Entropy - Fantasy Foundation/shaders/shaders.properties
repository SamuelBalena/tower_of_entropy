profile.LEVE=SHADOW_RESOLUTION:512 SHADOW_FILTER:0 WATER_DETAIL:0 LAVA_DETAIL:0 MATERIAL_QUALITY:1 AA_QUALITY:1 ANTIALIASING:1 AURORA_QUALITY:1 FOG_QUALITY:1
profile.EQUILIBRADO=SHADOW_RESOLUTION:1024 SHADOW_FILTER:1 WATER_DETAIL:1 LAVA_DETAIL:1 MATERIAL_QUALITY:2 AA_QUALITY:2 ANTIALIASING:2 AURORA_QUALITY:2 FOG_QUALITY:2
profile.ALTO=SHADOW_RESOLUTION:2048 SHADOW_FILTER:2 WATER_DETAIL:2 LAVA_DETAIL:2 MATERIAL_QUALITY:3 AA_QUALITY:3 ANTIALIASING:2 AURORA_QUALITY:3 FOG_QUALITY:3
screen=<profile> [ILUMINACAO] [SOMBRAS] [AGUA] [LAVA] [MATERIAIS] [ANTISSERRILHADO] [AURORA] [NEBLINA]
screen.ILUMINACAO=EXPOSURE SATURATION CONTRAST MAGIC
screen.SOMBRAS=SHADOW_RESOLUTION SHADOW_FILTER
screen.AGUA=WATER_DETAIL WATER_SSR
screen.LAVA=LAVA_DETAIL
screen.MATERIAIS=MATERIAL_QUALITY MATERIAL_SPECULAR MATERIAL_NORMAL MATERIAL_LABPBR
screen.ANTISSERRILHADO=ANTIALIASING AA_QUALITY AA_STRENGTH
screen.AURORA=AURORA AURORA_FREQUENCY AURORA_INTENSITY AURORA_SPEED AURORA_QUALITY
screen.NEBLINA=FOG_MODE FOG_QUALITY FOG_INTENSITY
sliders=EXPOSURE SATURATION CONTRAST MAGIC MATERIAL_SPECULAR MATERIAL_NORMAL AA_STRENGTH AURORA_FREQUENCY AURORA_INTENSITY AURORA_SPEED FOG_INTENSITY
oldLighting=false
underwaterOverlay=false
shadowTranslucent=false
clouds=off
sun=false
moon=false
size.buffer.colortex5=256 96

program.composite.enabled=ANTIALIASING == 2
program.composite1.enabled=ANTIALIASING == 2
customTexture.smaaArea=textures/smaa/area.bin TEXTURE_2D RG8 160 560 RG UNSIGNED_BYTE
customTexture.smaaSearch=textures/smaa/search.bin TEXTURE_2D R8 64 16 RED UNSIGNED_BYTE

# These BIOME and CAT constants come from the Oculus registry, not from numeric IDs in the pack.
variable.bool.toeEligible = in(biome, BIOME_SNOWY_PLAINS, BIOME_ICE_SPIKES, BIOME_FROZEN_RIVER, BIOME_FROZEN_OCEAN, BIOME_DEEP_FROZEN_OCEAN, BIOME_SNOWY_TAIGA, BIOME_GROVE, BIOME_JAGGED_PEAKS, BIOME_FROZEN_PEAKS, BIOME_SNOWY_SLOPES, BIOME_SNOWY_BEACH)
uniform.float.toeCold = smooth(if(toeEligible, 1.0, 0.0), 2.0, 2.0)
uniform.float.toeForest = smooth(if(in(biome_category, CAT_FOREST, CAT_TAIGA, CAT_JUNGLE), 1.0, 0.0), 2.0, 2.0)
uniform.float.toeMarsh = smooth(if(in(biome_category, CAT_SWAMP, CAT_RIVER), 1.0, 0.0), 2.0, 2.0)
uniform.float.toeMountain = smooth(if(in(biome_category, CAT_MOUNTAIN, CAT_EXTREME_HILLS), 1.0, 0.0), 2.0, 2.0)
uniform.float.toeDry = smooth(if(in(biome_category, CAT_DESERT, CAT_MESA, CAT_SAVANNA), 1.0, 0.0), 2.0, 2.0)
uniform.float.toeOverworld = if(in(biome_category, CAT_NETHER, CAT_THE_END), 0.0, 1.0)
